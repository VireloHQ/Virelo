name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check
  media-regressions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: Install FFmpeg
        timeout-minutes: 5
        run: |
          # Avoid the throttled Azure mirror (actions/runner-images#12949).
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run audit:package
      - run: node scripts/audit-multiuser.mjs
      - run: node scripts/audit-communication.mjs
      - run: node scripts/audit-scan-repair.mjs
      - run: node scripts/audit-accounts.mjs
      - run: node scripts/audit-account-administration.mjs
      - run: node scripts/audit-custom-commands.mjs
      - run: node scripts/audit-startup-scan.mjs
      - run: node scripts/audit-shorts-playback.mjs
      - run: node scripts/audit-motion.mjs
      - run: node scripts/audit-queue.mjs
      - run: node scripts/audit-playlists.mjs
      - run: node scripts/audit-library-explorer.mjs
