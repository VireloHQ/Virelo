name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Keep macOS coverage while hosted ARM64 runners have capacity constraints.
        os: [ubuntu-latest, windows-latest, macos-26-intel]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check -w apps/server
  media-regressions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: Install FFmpeg
        timeout-minutes: 8
        run: |
          # Prefer the runner's existing official archive over cloud-local mirrors.
          # Keep every fallback and Ubuntu's original signing-key policy.
          sudo sed -i 's#^https://archive\.ubuntu\.com/ubuntu/.*#https://archive.ubuntu.com/ubuntu/\tpriority:0#' /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install --yes --no-install-recommends -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: node scripts/audit-player-control-polish.mjs
      - run: node scripts/audit-volume-leveling.mjs
      - run: node scripts/audit-volume-modulation.mjs
      - run: node scripts/audit-measured-volume.mjs
      - run: node scripts/audit-volume-integration.mjs
      - run: node scripts/audit-volume-controls.mjs
      - run: npm run check
      - run: npm run audit:package
        env:
          VIRELO_RELEASE_OUTPUT: ${{ github.workspace }}/.release
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: .release/virelo-*.tgz
          include-hidden-files: true
          if-no-files-found: error
      - run: node --disable-warning=ExperimentalWarning --test scripts/audit-audio-loudness.mjs
      - run: node scripts/audit-multiuser.mjs
      - run: node scripts/audit-communication.mjs
      - run: node scripts/audit-scan-repair.mjs
      - run: node scripts/audit-accounts.mjs
      - run: node scripts/audit-account-administration.mjs
      - run: node scripts/audit-server-recovery.mjs
      - run: node scripts/audit-custom-commands.mjs
      - run: node scripts/audit-startup-scan.mjs
      - run: node scripts/audit-shorts-playback.mjs
      - run: node scripts/audit-motion.mjs
      - run: node scripts/audit-queue.mjs
      - run: node scripts/audit-playlists.mjs
      - run: node scripts/audit-library-explorer.mjs
  web-build:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check -w apps/web
  web-regressions:
    runs-on: ubuntu-24.04
    # Allow the bounded 8-minute tool setup plus the complete browser audit suite.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: Install FFmpeg
        timeout-minutes: 8
        run: |
          # Prefer the runner's existing official archive over cloud-local mirrors.
          # Keep every fallback and Ubuntu's original signing-key policy.
          sudo sed -i 's#^https://archive\.ubuntu\.com/ubuntu/.*#https://archive.ubuntu.com/ubuntu/\tpriority:0#' /etc/apt/apt-mirrors.txt
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install --yes --no-install-recommends -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: node scripts/audit-player-control-polish.mjs
      - run: node scripts/audit-volume-leveling.mjs
      - run: node scripts/audit-volume-modulation.mjs
      - run: node scripts/audit-measured-volume.mjs
      - run: node scripts/audit-audio-analysis.mjs
      - run: node scripts/audit-volume-integration.mjs
      - run: node scripts/audit-volume-controls.mjs
      - run: node scripts/audit-library-duplicates.mjs
      - run: node scripts/audit-browser-backup.mjs
      - run: node scripts/audit-hover-previews.mjs
      - run: node scripts/audit-initial-position.mjs
      - run: node scripts/audit-queue.mjs
      - run: node scripts/audit-playlists.mjs
      - run: node scripts/audit-library-explorer.mjs
      - run: node scripts/audit-browser-streaming.mjs
      - run: npm run build
      - run: node scripts/audit-avi.mjs
      - run: node scripts/audit-live-tv.mjs
      - run: node scripts/audit-codec-compatibility.mjs
