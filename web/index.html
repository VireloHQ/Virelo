    <!-- No-JS fallback only; it must not appear before the app's splash screen. -->
    <noscript>
      <main class="static-shell">
        <div>
          <h1>Your collection.<br />Now showing.</h1>
          <p>Your video folders, ready to watch in your browser. No account, uploads or installation required.</p>
          <p><a href="/app">Open web player</a><a href="/setup">Setup guide</a></p>
          <h2>A home for your videos.</h2>
          <p>Virelo is a free, open-source video library with Explorer navigation, search, favorites, watch progress, named playlists, editable queues, volume leveling and a swipeable Shorts feed. Choose from four player styles and five interface languages. The web player reads selected files on your device and stores library state in your browser. It needs no installation; supported browsers can also add it as a PWA.</p>
          <h2>Start with a folder.</h2>
          <p>Choose a folder in the web player, or open a terminal in your video folder and run <code>npx virelo</code>. The CLI requires stable Node.js 22.23.4+, 24.22.1+ or 26.12.1+ within those release lines, and supports Windows, macOS, Linux and Android via Termux. Virelo CLI 0.4+ requires sign-in; create the first administrator using localhost on the server device. Network access is opt-in and intended for trusted private networks.</p>
          <p>The self-hosted server also matches movie and series information, posters and backdrops automatically, with separate accounts, personal playlists, library permissions, private announcements and optional disclosed activity monitoring. Automatic movie and series information is not available in the browser-only player.</p>
          <h2>A few things to know.</h2>
          <details><summary>Does Virelo upload my videos?</summary><p>No. The web player reads only the folders you choose, and your video files stay on your device.</p></details>
          <details><summary>Can I run Virelo without installing it globally?</summary><p>Yes. Open a terminal in your video folder and run <code>npx virelo</code>.</p></details>
          <details><summary>Can I watch from another device?</summary><p>Yes. Run <code>npx virelo --host 0.0.0.0</code> on a trusted local network, then open the host computer’s local address from your other device.</p></details>
          <details><summary>Will every video work in my browser?</summary><p>Playback depends on your browser’s video codecs. The web player supports local audio conversion and embedded text subtitles for supported files. For broader compatibility, use the CLI with FFmpeg.</p></details>
          <p><a href="https://github.com/VireloHQ/Virelo-Web">Web source</a><a href="https://github.com/VireloHQ/Virelo">CLI source</a></p>
        </div>
      </main>
    </noscript>
