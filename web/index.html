<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050816" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Turn any folder into a private video library with Virelo." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Virelo" />
    <meta property="og:title" content="Virelo" />
    <meta property="og:description" content="Turn any folder into a private video library with Virelo." />
    <meta property="og:image" content="/virelo-icon-512.png?v=transparent-1" />
    <meta property="og:image:alt" content="Virelo logo" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Virelo" />
    <meta name="twitter:description" content="Turn any folder into a private video library with Virelo." />
    <meta name="twitter:image" content="/virelo-icon-512.png?v=transparent-1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=transparent-1" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=transparent-1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/virelo-icon-180.png?v=transparent-1" />
    <link rel="manifest" href="/manifest.webmanifest?v=transparent-1" />
    <title>Virelo</title>
    <style>
      html,body{margin:0;background:#111;color:#f4f2f6;font-family:system-ui,sans-serif}
      #startup-error{max-width:560px;margin:12vh auto;padding:24px;line-height:1.6}
      #startup-error[hidden]{display:none}
      #startup-error h1{font-size:28px;font-weight:700;line-height:1.25;margin:0 0 16px}
      #startup-error p{margin:0 0 16px}
      #startup-error p,#startup-error details{color:#c2bec6}
      #startup-error pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}
      #startup-error button,#startup-error a{display:inline-block;padding:10px 16px;margin:8px 12px 0 0;border:1px solid #666;border-radius:6px;background:#242424;color:#f4f2f6;font:inherit;text-decoration:none;cursor:pointer}
      #startup-error :focus-visible{outline:2px solid #b6a0ff;outline-offset:3px}
    </style>
    <script src="/startup.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <section id="startup-error" hidden role="alert" aria-labelledby="startup-error-title">
      <h1 id="startup-error-title">Virelo couldn’t start</h1>
      <p>The app’s files could not be loaded. If Virelo was just updated, restart the server, then try again. Your videos and saved data have not been changed.</p>
      <details><summary>Error details</summary><pre id="startup-error-detail"></pre></details>
      <button id="startup-reload" type="button">Try again</button><a href="/">Go to home</a>
    </section>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
